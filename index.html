<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Server Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(
        135deg,
        #667eea 0%,
        #764ba2 50%,
        #6a11cb 100%
    );
    overflow: hidden;
    position: relative;
}

/* Animated background circles */
.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    animation: float 10s infinite ease-in-out;
}

.circle:nth-child(1) {
    width: 250px;
    height: 250px;
    top: -80px;
    left: -80px;
}

.circle:nth-child(2) {
    width: 180px;
    height: 180px;
    bottom: -50px;
    right: -50px;
    animation-delay: 2s;
}

.circle:nth-child(3) {
    width: 120px;
    height: 120px;
    top: 15%;
    right: 15%;
    animation-delay: 4s;
}

@keyframes float {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-20px);
    }
}

.container {
    width: 90%;
    max-width: 650px;
    padding: 50px;
    text-align: center;

    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 24px;

    box-shadow:
        0 8px 32px rgba(0,0,0,0.2);

    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 42px;
}

h1 {
    font-size: 3rem;
    color: white;
    margin-bottom: 15px;
}

.highlight {
    color: #ffd369;
}

p {
    color: rgba(255,255,255,0.85);
    font-size: 1.1rem;
    line-height: 1.8;
    margin-bottom: 30px;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,255,100,0.15);
    color: #7CFFB2;
    padding: 10px 20px;
    border-radius: 50px;
    margin-bottom: 30px;
    font-weight: 500;
}

.status-dot {
    width: 12px;
    height: 12px;
    background: #00ff66;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ff66;
}

.btn {
    display: inline-block;
    text-decoration: none;
    padding: 14px 32px;
    background: white;
    color: #5b4dff;
    font-weight: 600;
    border-radius: 50px;
    transition: all 0.3s ease;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255,255,255,0.3);
}

.footer {
    margin-top: 30px;
    color: rgba(255,255,255,0.6);
    font-size: 0.9rem;
}

@media (max-width: 768px) {
    h1 {
        font-size: 2.2rem;
    }

    .container {
        padding: 35px 25px;
    }

    p {
        font-size: 1rem;
    }
}
</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">

    <div class="logo">🐍</div>

    <h1>Python Server <span class="highlight">Online</span></h1>

    <div class="status">
        <div class="status-dot"></div>
        Server Running Successfully
    </div>

    <p>
        Your local Python web server is active and ready to handle requests.
        Build APIs, serve applications, and deploy projects with confidence.
    </p>

    <a href="#" class="btn">Get Started</a>

    <div class="footer">
        Powered by Python • Local Development Environment
    </div>

</div>

</body>
</html>
